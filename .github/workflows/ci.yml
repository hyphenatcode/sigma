name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # The export tests (§3.8) render real PDFs through WeasyPrint, which
      # dlopens this stack — without it they fail on a bare runner. Fonts are
      # needed too: the report asks for Times New Roman, and fonts-liberation
      # provides the substitute fontconfig maps it to.
      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libfontconfig1 libcairo2 fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The suite runs on SQLite and needs neither PostgreSQL nor an API key,
      # so this is the whole story: 250 tests, no services.
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      # §8 step 3: prove every reference dataset still runs end to end and
      # every §3.3 refusal still fires. Exits non-zero if any analysis breaks.
      - name: Verify reference datasets
        working-directory: backend
        run: python scripts/verify_reference_datasets.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Builds the image and proves WeasyPrint can actually render inside it —
      # the failure this image exists to prevent is a missing native library,
      # which only shows up at render time, not at import.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sigma-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PDF rendering inside the image
        run: |
          docker run --rm --entrypoint python sigma-backend:ci -c "
          import weasyprint
          pdf = weasyprint.HTML(string='<p>Türkçe ölçüm — ğüşıöç</p>').write_pdf()
          assert pdf.startswith(b'%PDF-'), 'WeasyPrint did not produce a PDF'
          print(f'PDF rendered in image: {len(pdf)} bytes')
          "
